# Nginx site for Daybook. Copy to /etc/nginx/sites-available/, link into sites-enabled, then run
# `sudo certbot --nginx -d daybook.cembers.in`, which adds the HTTPS (443) block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name daybook.cembers.in;

    # Photo uploads are up to 15 MB (server/uploads.ts).
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Rate limits key on the client IP (server/rate-limit.ts). Overwrite these headers so a
        # visitor can't fake them, and clear Cloudflare's, which only Cloudflare may set.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
    }
}
